# Grog docs site (VitePress -> GitHub Pages), modeled on Libation's deploy workflow.
#
# INERT UNTIL ENABLED: manual dispatch only for now, and it requires Settings -> Pages ->
# Source = "GitHub Actions" first. Once the site goes live, uncomment the push trigger so
# docs edits publish themselves.
name: Deploy docs site to Pages

on:
  # push:
  #   branches: [master]
  #   paths:
  #     - .github/workflows/docs.yml
  #     - docs/**
  #     - .vitepress/**
  #     - index.md
  #     - public/**
  #     - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated needs history
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build with VitePress
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
